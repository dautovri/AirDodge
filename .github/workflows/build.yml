name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: AirDodge build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select the current stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Runners keep simulators from older Xcodes around; only the newest iOS
          # runtime is guaranteed to be usable by the selected Xcode.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devs = json.load(sys.stdin)["devices"]
          def ver(rt):
              m = re.search(r"iOS-(\d+)-(\d+)", rt)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          runtimes = sorted((rt for rt in devs if ".iOS-" in rt), key=ver, reverse=True)
          ids = [d["udid"] for rt in runtimes for d in devs[rt] if d["name"].startswith("iPhone")]
          print(ids[0] if ids else "")')
          [ -n "$UDID" ] || { echo "No iPhone simulator available" >&2; exit 1; }
          echo "destination=id=$UDID" >> "$GITHUB_OUTPUT"
      - name: AirDodge build
        run: |
          set -o pipefail
          xcodebuild build -project AirpodsGame.xcodeproj -scheme AirpodsGame \
            -destination "${{ steps.sim.outputs.destination }}" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
