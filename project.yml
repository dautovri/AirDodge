name: AirpodsGame
options:
  bundleIdPrefix: com.airdodge
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"

targets:
  AirpodsGame:
    type: application
    platform: iOS
    sources:
      - AirpodsGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdodge.AirpodsGame
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: AirpodsGame/Info.plist
        DEVELOPMENT_TEAM: "27EZNUVV57"
        CODE_SIGN_STYLE: Automatic
    dependencies: []
