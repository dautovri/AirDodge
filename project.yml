name: AirpodsGame
options:
  bundleIdPrefix: com.airdodge
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "15"

targets:
  AirpodsGame:
    type: application
    platform: iOS
    sources:
      - AirpodsGame
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airdodge.AirpodsGame
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "14"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: AirpodsGame/Info.plist
        DEVELOPMENT_TEAM: "27EZNUVV57"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []
